# Nginx: add inside your server { } block for burhaniguardspune.baawan.com
# Serve privacy.html when request is /privacy or /privacy/
location = /privacy {
    try_files /privacy.html =404;
}
location = /privacy/ {
    try_files /privacy.html =404;
}

