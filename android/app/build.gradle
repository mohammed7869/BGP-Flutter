plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 🔐 Load keystore properties (MUST be AFTER plugins block)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.burhaniguards.pune.app"
    compileSdk = 35
    buildToolsVersion = "35.0.0"
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.burhaniguards.pune.app"
        minSdk = flutter.minSdkVersion
        targetSdk = 35  // Required by Google Play (min API 35)
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // 🔐 Signing configuration
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    // 🔐 Apply signing to release build
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }

    // Optional: Custom APK name
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "B.G.P App.apk"
        }
    }
}

flutter {
    source = "../.."
}
